<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>New Tab</title>
</head>

<body>
	<form id="form">
		<div id="outer_bar" class="bar">
			<input id="search" class="bar" type="text" id="search" name="search_bar" placeholder="Search" />
			<input id="submit" class="bar" type="submit" value=">">
		</div>
		<div id="engines">
			<input type="radio" value="google" name="engine_selector">
			<label for="google">Google</label><br>

			<input type="radio" value="bing" name="engine_selector">
			<label for="bing">Bing</label><br>

			<input type="radio" value="brave" name="engine_selector" checked>
			<label for="brave">Brave</label><br>

			<input type="radio" value="ddg" name="engine_selector">
			<label for="ddg">Duck Duck Go</label><br>

			<input type="radio" value="startpage" name="engine_selector">
			<label for="startpage">Start Page</label><br>

			<input type="radio" value="qwant" name="engine_selector">
			<label for="qwant">Qwant</label><br>
		</div>
	</form>
</body>


<script>
	const Engines = {
		google: "https://www.google.com/search?q=",
		bing: "https://www.bing.com/search?q=",
		brave: "https://search.brave.com/search?q=",
		ddg: "https://duckduckgo.com/?q=",
		startpage: "https://www.startpage.com/search?q=",
		qwant: "https://www.qwant.com/?q="
	};

	document.getElementById("form").addEventListener("submit", (event) => {
		event.preventDefault();
		const data = new FormData(event.target);

		engine = data.get("engine_selector")

		for (const i in Engines) {
			if (engine == i) {
				engine = Engines[i];
			}
		}

		window.open(engine + data.get("search_bar").replace(/ /g, '+'), "_self")
	});
</script>


<style>
	* { outline: none; }
	body {
		background-color: #171717;
		color: white;
	}

	.bar {
		background-color: #454545;
		color: white;

		text-decoration: none;
		font-size: 1.65rem;

		border-radius: 15px;
		border: none;
	}

	#outer_bar {
		position: absolute;
		top: 45%;
		left: 50%;
		transform: translateX(-50%);

		padding: 7px;
		padding-left: 10px;
		border-radius: 15px;
		width: 40rem;
	}

	
	#submit {
		background-color: #00A7E0;
		color: #454545;

		width: 4rem;
		height: 4rem;
		transition-duration: 300ms;
	}
	#submit:hover { background-color: #00C2FF; }

	#search {
		padding: 5px;
		width: 35rem;
		outline: none; 
	}

	#engines {
		position: absolute;
		left: 15px;
		bottom: 15px;
	}
	
	input[type="radio"] {
		width: 12px;
		height: 12px;
		border-radius: 50%;
		background-color: #454545;
		appearance: none;
		transition-duration: 300ms;
	}
	input[type="radio"]:hover {
		background-color: #505050;
	}
	input[type="radio"]:checked { background-color: #00A7E0; }
	input[type="radio"]:checked:hover { background-color: #00C2FF; }
	
</style>

</html>
